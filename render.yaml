services:
  - type: web
    name: pucela-us
    runtime: node
    plan: free
    buildCommand: node --check server/node.js
    startCommand: node server/node.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SANAGUS_SECRET
        generateValue: true
